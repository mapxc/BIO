<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Визитка</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<button id="resumeBar" class="resume-bar" type="button">РЕЗЮМЕ</button>
<main>
  <nav id="langs" class="langs" aria-label="Language"></nav>
  <header class="hero">
    <p class="prompt">$ whoami</p>
    <h1 id="name">Имя Фамилия</h1>
    <p id="tagline" class="tag"></p>
  </header>
  <section aria-labelledby="h-soc">
    <h2 id="h-soc">Связаться</h2>
    <div id="socials" class="grid socials"></div>
  </section>
  <section aria-labelledby="h-lnk">
    <h2 id="h-lnk">Профили и площадки</h2>
    <div id="links" class="list"></div>
  </section>
  <section aria-labelledby="h-abt">
    <h2 id="h-abt">О себе</h2>
    <p id="about" class="about"></p>
  </section>
</main>
<footer><span id="yr"></span><button id="adm" class="adm" type="button" aria-label="Вход для владельца">◼</button></footer>
<div id="adminbar" class="adminbar" hidden></div>
<div id="overlay" class="overlay" hidden><div id="dlg" class="dlg" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<noscript><p style="padding:2rem">Для работы страницы нужен JavaScript.</p></noscript>
</body>
</html>
